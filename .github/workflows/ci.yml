name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secop_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      # Real Postgres and Redis; no model and no embedding model.
      - run: uv run pytest
      - name: The Kubernetes manifests render
        run: |
          cp k8s/local/secret.env.example k8s/local/secret.env
          kubectl kustomize k8s/local > /dev/null
